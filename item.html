<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کافه حجره | صفحه محصول</title>
    
    <link type="text/css" rel="stylesheet" href="styles/item-page.css"/>
    <link type="text/css" rel="stylesheet" href="styles/styles.css"/>
    <link rel="stylesheet" href="styles/fonts.css">
    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/item-page.js"></script>
  </head>
  <body class="relative min-h-screen w-full overflow-x-hidden">
    <div class="flex w-full items-center justify-center bg-[#fff9f0]" style="font-family: Neirizi; font-size: large;">
      <div class="main min-h-screen max-w-[520px] bg-[#fff9f0] p-6 px-10 mb-32 relative">
        <!-- navbar -->
        <nav class="flex h-[56px] w-full items-center justify-between rounded-[16px] bg-[#FFF6E8] px-3 overflow-visible shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)]">
          <button onclick=goToSearch() class="flex w-10 items-center justify-center">
            <img src="/images/search.png" alt="search-bar" class="h-8 w-8" loading="eager" decoding="async"/>
          </button>
  
          <button class="flex w-16 items-center justify-center overflow-visible" onclick=goToHome()>
            <img src="/images/logo.png" alt="logo" class="w-[95px] logo" loading="eager" decoding="async"/>
          </button>
  
          <button class="menu-btn flex w-10 items-center justify-center" onclick=toggleMenu()>
            <div class="h-8 w-8">
              <img src="/images/menu.svg" alt="menu" class="h-8 w-8" loading="eager" decoding="async"/>
            </div>
          </button>
        </nav>
        
        <!-- item image -->
        <div class="flex flex-col items-center justify-center">
          <img class="item-image mt-16 h-full w-full rounded-[16px] flex" id="carousel" src="" alt="">
          <div class="dots flex items-center justify-center h-full w-full gap-2 mt-4"></div>
        </div>

        <!-- item description -->
        <div class="item-center mt-4 flex flex-col justify-center px-4" dir="rtl">
          <div class="flex items-center justify-between w-full">
            <h1 class="item-name text-xl" style="font-weight: 700"></h1>
            <span class="text-sm single_word"></span>
            <span class="text-sm item_price"></span>
          </div>
          <div class="inventory-container flex items-center justify-start w-full gap-2 pt-3">
            <p class="text-sm" style="font-weight: 300">موجودی:</p>
            <span class="text-sm inventory"></span>
          </div>
          <p class="item-description mt-4 text-sm leading-6"></p>
        </div>

        <div dir="rtl" class="option-list col-span-3 mt-1 flex h-full w-full flex-col items-start justify-center bg-transparent ml-3 p-1">
          
        </div>

        <!-- menu -->
        <div id="sideMenu" class="slide-menu flex flex-col items-center justify-start bg-[#FFF6E8] py-8">
          <a href="/profile.html" class="w-full px-6 pb-4 pt-3 text-right text-base font-bold text-[#241E17] hover:bg-[#2CA7DB]">پروفایل</a>
          <a href="/order-history.html" class="w-full px-6 pb-4 pt-3 text-right text-base font-bold text-[#241E17] hover:bg-[#2CA7DB]">سفارش های پیشین</a>
          <a href="/about-us.html" class="w-full px-6 pb-4 pt-3 text-right text-base font-bold text-[#241E17] hover:bg-[#2CA7DB]">درباره ما</a>
          <div class="w-full h-full"></div>
          <button class="w-full px-6 pb-4 pt-3 text-right text-base font-bold text-[#241E17] hover:bg-[#2CA7DB]" onclick=logout()>خروج</button>
        </div>
        <div id="closeMenu" class="slide-left" onclick=toggleClose()>
          <img src="/images/close.svg" alt="close" class="h-6 w-6" loading="eager" decoding="async">
        </div>
        
        <!-- complete order btn -->
        <div class="cart-button cursor-pointer mt-4 flex h-14 w-full items-center justify-center gap-2 rounded-[16px] bg-[#018FCC] text-white" dir="rtl">
          <span class="text-xl hover:font-bold">سبد خرید</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.58683 10H21.4132M18.0351 6L5.96486 6C3.45403 6 1.57594 8.32624 2.08312 10.808L3.71804 18.808C4.09787 20.6666 5.71942 22 7.59978 22H16.4002C18.2806 22 19.9021 20.6666 20.282 18.808L21.9169 10.808C22.4241 8.32624 20.546 6 18.0351 6Z" stroke="#FFF9F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 2L6 6" stroke="#FFF9F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 2L18 6" stroke="#FFF9F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 14L9 18" stroke="#FFF9F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 14L15 18" stroke="#FFF9F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        
      </div>

      <!-- action buttons -->
      <div class="fixed bottom-0 left-1/2 transform -translate-x-1/2 grid w-full max-w-[520px] grid-cols-3 space-x-6 px-10 pb-5 bg-[#fff9f0]">          
        <button onclick=goToMenu() class="return-button col-span-1 bg-[#FFF6E8] shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)] rounded-[16px] text-[#241E17] text-lg">
          بازگشت
        </button>
        <button class="item-select col-span-2 bg-[#018FCC] text-white rounded-[16px] h-14 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)] text-lg disabled:bg-[#a5cddf] disabled:text-[#696969]">
          انتخاب
        </button>
      </div>
    </div>

    <!-- Modal HTML -->
    <div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000;">
      <div style=" background: #fff; padding: 20px 30px; border-radius: 8px; max-width: 300px; width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; text-align: center;">
        <span id="closeBtn" style="
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 24px;
            line-height: 1;
            user-select: none;
        ">&times;</span>
        <p id="modalMessage" style="margin: 0; font-size: 16px;"></p>
      </div>
    </div>
  </body>
</html>
