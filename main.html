<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کافه حجره</title>
    
    <link type="text/css" rel="stylesheet" href="styles/main.css"/>
    <!-- <link type="text/css" rel="stylesheet" href="styles/styles.css"/> -->
    <link type="text/css" rel="stylesheet" href="styles/skeleton.css"/>
    <link rel="stylesheet" href="styles/fonts.css">
    <script src="js/main.js"></script> 
    <script src="js/script.js"></script> 
  </head>
  <body class="relative min-h-screen w-full overflow-x-hidden" style="font-family: Neirizi; font-size: large;">
  <div class="min-h-screen bg-[#fff9f0] flex items-center justify-center">
    <div class="relative w-full max-w-[520px] bg-[#fff9f0] p-6 px-10">
      <!-- navbar -->
      <nav class="flex h-[56px] w-full items-center justify-between rounded-[16px] bg-[#FFF6E8] px-3 overflow-visible shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)]">
        <button onclick=goToSearch() class="flex w-10 items-center justify-center">
          <img src="/images/search.png" alt="search-bar" class="h-8 w-8" loading="eager" decoding="async"/>
        </button>

        <button class="flex w-16 items-center justify-center overflow-visible" onclick=goToHome()>
          <img src="/images/logo.png" alt="logo" class="w-[95px] logo" loading="eager" decoding="async"/>
        </button>

        <button class="menu-btn flex w-10 items-center justify-center" onclick=toggleMenu()>
          <div class="h-8 w-8">
            <img src="/images/user.svg" alt="menu" class="h-8 w-8" loading="eager" decoding="async"/>
          </div>
        </button>
      </nav>

      <div class="text-center my-10" dir="rtl">
        <h1 class="text-3xl font-bold text-[#665541] mb-3">کافه حجره</h1>
        <p class="text-lg text-[#665541]/80 leading-relaxed">
          # ۶ متری حجره !
          <!-- جایی برای لحظات خوب و قهوه‌های بی‌نظیر -->
        </p>
      </div>

      <!-- best seller -->
      <div class="mb-8" dir="rtl">
        <h3 class="best_seller text-lg font-bold text-[#665541] mb-4" style="font-size: larger;"> پرفروش ها </h3>
        <div class="best_seller_items flex gap-4 overflow-x-auto p-4 bg-[#FFF6E8] rounded-2xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)]">
          
          <div class="flex items-center justify-around w-full">
            <div class="flex flex-col items-center min-w-[100px] group cursor-pointer sk-loading">
              <div class="w-20 h-20 rounded-2xl overflow-hidden mb-2 transition-transform group-hover:scale-105 sk-img"></div>
              <p class="text-sm font-medium text-center text-[#665541] sk-caption"></p>
            </div>

            <div class="flex flex-col items-center justify-center shrink-0 w-28 sk-loading">
              <div class="sk-img"></div>
              <p class="sk-caption"></p>
            </div>

            <div class="flex flex-col items-center justify-center shrink-0 w-28 sk-loading">
              <div class="sk-img"></div>
              <p class="sk-caption"></p>
            </div>
          </div>

        </div>
      </div>

      <!-- menu button -->
      <button onclick=goToMenu() class="inline-flex items-center justify-center gap-2 whitespace-nowrap ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 px-4 py-2 w-full h-14 mb-8 bg-[#2CA7DB] hover:bg-[#2CA7DB]/90 text-white text-2xl font-bold rounded-2xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)] transition-all duration-200 cursor-pointer">
          منو
      </button>

      <!-- contact -->
      <div dir="rtl" class="bg-[#FFF6E8] rounded-2xl p-6 mb-6 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)]">
        <!-- <h3 class="text-lg font-bold text-[#665541] mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-phone w-5 h-5 text-[#2CA7DB]">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
            </path>
          </svg>
          اطلاعات تماس
        </h3> -->
        <div class="space-y-3">
          <div class="flex items-start gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin w-5 h-5 text-[#2CA7DB] mt-0.5 flex-shrink-0">
              <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0">
              </path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <p class="address text-[#665541] leading-relaxed">
            </p>
          </div>
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-phone w-5 h-5 text-[#2CA7DB]">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
              </path>
            </svg>
            <a href="" class="phone_number text-[#665541] font-medium">
            
            </a>
          </div>
        </div>

      </div>

      <!-- map -->
      <div dir="rtl" class="bg-[#FFF6E8] rounded-2xl p-6 mb-6 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)]">
        <h3 class="text-lg font-bold text-[#665541] mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin w-5 h-5 text-[#2CA7DB]">
            <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0">
            </path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          ما اینجایم 
        </h3>
        <div class="h-64 rounded-xl overflow-hidden bg-gray-100 border-2 border-[#2CA7DB]/20">
          <div class="w-full h-full rounded-lg">
            <iframe src="leaflet/main.html" frameborder="0" class="w-full h-full"></iframe>
          </div>
        </div>
      </div>

      <!-- working hour -->
      <div dir="rtl" class="bg-[#FFF6E8] rounded-2xl p-6 mb-6 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)]">
        <h3 class="text-lg font-bold text-[#665541] mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock w-5 h-5 text-[#2CA7DB]">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          ساعات کاری
        </h3>
        <div class="working_hours space-y-3">

        </div>
      </div>


      <!-- social media -->
      <div dir="rtl" class="bg-[#FFF6E8] rounded-2xl p-6 mb-6 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)] transition-all duration-200 hover:shadow-[0_4px_12px_-2px_rgba(0,0,0,0.15)] cursor-pointer group">
        <div class="flex items-center justify-between instagram_button">
          
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-instagram w-6 h-6 text-[#2CA7DB] group-hover:scale-110 transition-transform">
              <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
            </svg>
            <h3 class="instagram_text text-[#665541] font-light text-base">
            </h3>
          </div>

          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link w-5 h-5 text-[#665541]/60 group-hover:text-[#2CA7DB] transition-colors" >
            <path d="M15 3h6v6"></path>
            <path d="M10 14 21 3"></path>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          </svg>

        </div>
      </div>

 
      <!-- e-namad -->
      <div dir="rtl" class="flex flex-col h-full w-full items-start rounded-[16px] bg-[#FFF6E8] shadow-[0_2px_8px_-2px_rgba(0,0,0,0.4)] mt-6 p-2 px-5">
        <a referrerpolicy='origin' target='_blank' href='https://trustseal.enamad.ir/?id=559069&Code=1ZeLBELTd6e0MRy4xqpxeUfq7sf6So6k'>
          <!-- <img referrerpolicy='origin' src='https://trustseal.enamad.ir/logo.aspx?id=559069&Code=1ZeLBELTd6e0MRy4xqpxeUfq7sf6So6k' alt='اینماد' style='cursor:pointer' code='1ZeLBELTd6e0MRy4xqpxeUfq7sf6So6k' class="h-14 w-14"> -->
          <img referrerpolicy='origin' src='images/81.png' alt='اینماد' style='cursor:pointer' code='1ZeLBELTd6e0MRy4xqpxeUfq7sf6So6k' class="h-14 w-14">
        </a>
      </div>

      <div class="text-center mt-8 pb-6">
        <p class="text-[#665541]/60 text-sm">
          © ۱۴۰۳ کافه حجره. تمامی حقوق محفوظ است.
        </p>
      </div>

      <!-- menu -->
      <div id="sideMenu" class="slide-menu flex flex-col items-center justify-start bg-[#FFF6E8] py-8">
        <a href="/profile.html" class="w-full px-6 pb-4 pt-3 text-right text-base font-bold text-[#241E17] hover:bg-[#2CA7DB]">پروفایل</a>
        <a href="/order-history.html" class="w-full px-6 pb-4 pt-3 text-right text-base font-bold text-[#241E17] hover:bg-[#2CA7DB]">سفارش های پیشین</a>
        <a href="/about-us.html" class="w-full px-6 pb-4 pt-3 text-right text-base font-bold text-[#241E17] hover:bg-[#2CA7DB]">درباره ما</a>
        <div class="w-full h-full"></div>
        <button class="w-full px-6 pb-4 pt-3 text-right text-base font-bold text-[#241E17] hover:bg-[#2CA7DB]" onclick=logout()>خروج</button>
      </div>
      <div id="closeMenu" class="slide-left" onclick=toggleClose()>
        <img src="/images/close.svg" alt="close" class="h-6 w-6" loading="eager" decoding="async">
      </div>
      
    </div>
  </div>

    <!-- Modal HTML -->
    <div id="modal" style="display:none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center;z-index: 1000;">
      <div style="
          background: #fff;
          padding: 20px 30px;
          border-radius: 8px;
          max-width: 300px;
          width: 90%;
          box-shadow: 0 4px 15px rgba(0,0,0,0.3);
          position: relative;
          text-align: center;
      ">
        <span id="closeBtn" style="
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 24px;
            line-height: 1;
            user-select: none;
        ">&times;</span>
        <p id="modalMessage" style="margin: 0; font-size: 16px;"></p>
      </div>
    </div>

    
  </body>
</html>
