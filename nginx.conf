server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /usr/share/nginx/html;
    index index.html index.htm main.html;  # Include main.html in the index

    server_name _;

    location / {
        try_files $uri $uri/ /main.html;  # Serve main.html if no other file is found
    }

    location ~* \.(ttf|ttc|otf|eot|woff|woff2)$ {
        add_header Access-Control-Allow-Origin *;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
